pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'vein-expansion'

// One module per supported Minecraft version, see versions/<name>.
['1.21.1', '1.21.11', '26.1', '26.2', '26.3'].each { version ->
    include "neoforge-${version}"
    project(":neoforge-${version}").projectDir = file("versions/neoforge-${version}")
}

include 'forge-1.20.1'
project(':forge-1.20.1').projectDir = file('versions/forge-1.20.1')
